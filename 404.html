<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Native MUI</title>
<script>try{var t=localStorage.getItem("nmui-theme");if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("theme",t)}catch(e){document.documentElement.setAttribute("theme","light")}</script>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script type="module" src="/app.js"></script>
<App></App>
