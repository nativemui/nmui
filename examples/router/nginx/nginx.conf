# nginx — SPA fallback via try_files.
# Real files and folders serve as-is; everything else is index.html.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: an API on the same domain must be matched BEFORE
    # the fallback, or API paths will return HTML.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3000;
    # }
}
