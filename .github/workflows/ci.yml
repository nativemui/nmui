name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every JavaScript file
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check
      - name: Check CSS brace balance
        run: |
          python3 - <<'EOF'
          import glob, sys
          files = glob.glob("**/*.css", recursive=True)
          bad = [f for f in files if open(f).read().count("{") != open(f).read().count("}")]
          if bad:
              print("Unbalanced braces:", bad)
              sys.exit(1)
          print(f"Checked {len(files)} CSS files")
          EOF
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Smoke-render the site
        run: |
          python3 serve.py & SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 2
          node tools/smoke.mjs
